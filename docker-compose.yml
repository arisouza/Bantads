version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bantads-postgres
    restart: unless-stopped
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=128MB"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=bantads
      - TZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/ms-conta/schema.sql:/docker-entrypoint-initdb.d/01-conta-schema.sql:ro
      - ./database/ms-conta/seed.sql:/docker-entrypoint-initdb.d/02-conta-seed.sql:ro
    networks:
      - bantads-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: bantads-mongo
    restart: unless-stopped
    mem_limit: 384m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin}
      - TZ=America/Sao_Paulo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/ms-auth/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - bantads-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7
    container_name: bantads-redis
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bantads-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bantads-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin}
      - RABBITMQ_VM_MEMORY_HIGH_WATERMARK=0.6
      - TZ=America/Sao_Paulo
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bantads-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: bantads_postgres_data
  mongo_data:
    name: bantads_mongo_data
  redis_data:
    name: bantads_redis_data
  rabbitmq_data:
    name: bantads_rabbitmq_data

networks:
  bantads-network:
    name: bantads_network
    driver: bridge