version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bantads-postgres
    restart: unless-stopped
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=128MB"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=bantads
      - TZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bantads-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: bantads-mongo
    restart: unless-stopped
    mem_limit: 384m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin}
      - TZ=America/Sao_Paulo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bantads-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: bantads_postgres_data
  mongo_data:
    name: bantads_mongo_data

networks:
  bantads-network:
    name: bantads_network
    driver: bridge