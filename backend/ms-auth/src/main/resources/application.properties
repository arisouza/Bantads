spring.application.name=ms-auth
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:admin@localhost:27017/bantads_auth?authSource=admin}
spring.data.mongodb.auto-index-creation=true
server.port=${SERVER_PORT:8082}
management.endpoints.web.exposure.include=health,info
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
